[package]
name = "ldr-plc-desktop"
version = "0.1.0"
description = "PLC 调试上位机 Demo"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ldr_plc_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# bundled：自带 SQLite，不依赖本机是否安装 sqlite3.dll
rusqlite = { version = "0.32", features = ["bundled"] }
# P1：异步运行时 + Modbus TCP 长连接 + 心跳随机数
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
tokio-modbus = "0.17"
rand = "0.8"

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
